        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x04e3e5fffea1fbb0_l2

      - name: "D3 第三路燈控"
        unique_id: ws07_d3_l3_light_control_cn
        icon: mdi:light-switch
        state: "{{ is_state('switch.0x04e3e5fffea1fbb0_l3', 'on') }}"
