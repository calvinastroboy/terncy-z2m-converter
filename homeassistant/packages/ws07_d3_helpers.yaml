      - name: "D3 第一路無線 LED"
        unique_id: ws07_d3_l1_wireless_led_cn
        icon: mdi:led-outline
        state: "{{ is_state('select.0x04e3e5fffea1fbb0_wireless_led_status_l1', 'on') }}"
        turn_on:
          - service: select.select_option
            target:
              entity_id: select.0x04e3e5fffea1fbb0_wireless_led_status_l1
            data:
              option: "on"
        turn_off:
          - service: select.select_option
            target:
              entity_id: select.0x04e3e5fffea1fbb0_wireless_led_status_l1
