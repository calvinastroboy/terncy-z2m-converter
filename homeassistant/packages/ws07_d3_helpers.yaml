          - service: switch.turn_on
            target:
              entity_id: switch.0x04e3e5fffea1fbb0_l3
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x04e3e5fffea1fbb0_l3

      - name: "D3 第一路繼電器啟用"
        unique_id: ws07_d3_l1_relay_enabled_cn
        icon: mdi:electric-switch
        state: "{{ is_state('switch.0x04e3e5fffea1fbb0_relay_enabled_l1', 'on') }}"
