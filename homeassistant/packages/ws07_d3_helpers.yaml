              entity_id: switch.0x04e3e5fffea1fbb0_relay_enabled_l2

      - name: "D3 第三路繼電器啟用"
        unique_id: ws07_d3_l3_relay_enabled_cn
        icon: mdi:electric-switch
        state: "{{ is_state('switch.0x04e3e5fffea1fbb0_relay_enabled_l3', 'on') }}"
        turn_on:
          - service: switch.turn_on
            target:
              entity_id: switch.0x04e3e5fffea1fbb0_relay_enabled_l3
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x04e3e5fffea1fbb0_relay_enabled_l3

      - name: "D3 第一路常供電"
        unique_id: ws07_d3_l1_constant_power_cn
        icon: mdi:power-plug
        state: "{{ is_state('switch.0x04e3e5fffea1fbb0_relay_constant_power_l1', 'on') }}"
        turn_on:
          - service: switch.turn_on
            target:
              entity_id: switch.0x04e3e5fffea1fbb0_relay_constant_power_l1
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.0x04e3e5fffea1fbb0_relay_constant_power_l1

      - name: "D3 第二路常供電"
        unique_id: ws07_d3_l2_constant_power_cn
        icon: mdi:power-plug
        state: "{{ is_state('switch.0x04e3e5fffea1fbb0_relay_constant_power_l2', 'on') }}"
